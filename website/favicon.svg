<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Terminal Deck">
  <title>Terminal Deck</title>
  <style>
    .card { fill: #ffffff; stroke: #37352f; }
    .back { fill: none; stroke: #9b9a97; }
    .bar  { fill: #37352f; }
    .bar-dim { fill: #9b9a97; }
    .dot  { fill: #2383e2; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #191919; stroke: #d4d4d4; }
      .back { stroke: #6f6f6f; }
      .bar  { fill: #d4d4d4; }
      .bar-dim { fill: #6f6f6f; }
      .dot  { fill: #529cca; }
    }
  </style>
  <rect class="back" x="17.5" y="7.5" width="39" height="29" rx="6" stroke-width="3"/>
  <rect class="card" x="7.5" y="21.5" width="41" height="35" rx="6" stroke-width="3"/>
  <circle class="dot" cx="17" cy="32" r="3"/>
  <rect class="bar" x="25" y="30.5" width="16" height="3" rx="1.5"/>
  <rect class="bar-dim" x="17" y="42" width="24" height="3" rx="1.5"/>
</svg>
