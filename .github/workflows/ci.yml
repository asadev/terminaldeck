name: CI

# Every push to main is the source of a release. The publisher reads this run's result for the exact
# commit before the GitHub release (and the in-app update the Mac and Windows apps offer) goes out.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    name: Mac app compiles
    # The source needs Xcode 27 (Swift 6.4); the macos-26 image tops out at Swift 6.3 (0.21.0 CI, 4 Nov). GitHub's
    # Xcode 27 image (preview label xcode-27) until a macos-27 image ships.
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      # Xcode 26+ ships the Metal compiler as a separate component; SwiftTerm's shaders need it (0.21.0 CI, 4 Nov).
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build the Swift package
        run: swift build --package-path macos/TerminalDeckNative

  windows-core:
    name: Windows core builds; update channel and update rules tested
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
      - name: Build the core
        run: dotnet build windows/TerminalDeck.Core.slnf -c Release
      - name: Update channel tests
        run: dotnet test windows/tests/TerminalDeck.Core.Tests/TerminalDeck.Core.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~GitHubReleaseChannel|FullyQualifiedName~UpdateReadiness"

  # Which parts changed. The Windows app job below runs only when windows/ (or this file) changed;
  # a skipped job counts as passed.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with: build Windows."
            echo "windows=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(windows/|\.github/workflows/ci\.yml$)'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  # The real Windows app (the WinUI window, not only the shared core), compiled on a Windows machine
  # with the XAML compiler, plus the helper programs the installer ships. Nothing is signed or published.
  windows-app:
    name: Windows app builds
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/Directory.Build.props', 'windows/global.json') }}
      - name: Build the app (window, keeper, core, Windows platform)
        shell: pwsh
        run: dotnet build windows/src/TerminalDeck.App/TerminalDeck.App.csproj -c Release -p:Platform=x64 -nologo -v minimal
      - name: Build the helpers the installer ships
        shell: pwsh
        run: |
          dotnet build windows/src/TerminalDeck.ToolBridge/TerminalDeck.ToolBridge.csproj -c Release -nologo -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build windows/tests/TerminalDeck.Servers.Askpass/TerminalDeck.Servers.Askpass.csproj -c Release -nologo -v minimal
