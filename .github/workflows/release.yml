name: Release

# Only a version tag releases. Pushing to main never does — cutting a release
# is an explicit act by the owner (`npm version …` then `git push --follow-tags`).
#
# `workflow_dispatch` builds the same installers from any commit and stops short
# of publishing. It is not a convenience: the working tree on the machine this
# is developed from is routinely mid-edit across several agents at once, and a
# local `dist:win` bakes whatever half-finished state happens to be on disk into
# the artifact. A dispatched run is the only way to get an installer that
# provably corresponds to a commit — CI checks the tree out clean.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build (a dispatched run never publishes)
        type: choice
        options: [both, windows, macos]
        default: both

permissions:
  # Creating the Release and uploading its assets. Nothing else.
  contents: write

jobs:
  macos:
    # arm64 only, built natively — macos-latest is Apple silicon. No x64 slice
    # is produced: macOS 27 drops Intel hardware entirely, and an x64 build here
    # could only ever be cross-compiled and never tested on real Intel hardware.
    runs-on: macos-latest
    timeout-minutes: 45
    if: inputs.platforms != 'windows'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No cache here on purpose: a release is rare, and the one thing worse
      # than a slow release build is one assembled from a stale node_modules.
      - name: Install
        run: npm ci

      # A tag that disagrees with package.json means the artifacts inside the
      # dmg would be stamped with a different version than the release naming
      # them. `npm version` keeps the two in step; this catches a hand-made tag.
      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `dist:mac` is `npm run build && npm run build:pwa && electron-builder …
      # --publish never`, and all three parts matter. electron-builder packages
      # whatever is in `out/` and does not produce it — a run without the build
      # step fails the asar sanity check ("out/main/index.js … was not found in
      # this archive"), which is verified behaviour, not a guess.
      #
      # `build:pwa` is the part that was missing until 0.1.6, and it took three
      # releases to notice. `pwa/dist` is build output, so it is gitignored, so
      # a clean CI checkout does not have it, so the electron-builder allowlist
      # line `pwa/dist/**/*` matched zero files — and an allowlist entry that
      # matches nothing looks exactly like one whose files were all excluded.
      # Nothing warned. Three releases shipped with the phone client absent and
      # the address the Remote panel prints answering with nothing.
      #
      # `--publish never` is the last part: electron-builder infers a GitHub
      # publish target from the `repository` field and would upload on its own.
      # Uploading happens below instead, explicitly, with the artifacts chosen
      # here.
      - name: Build the mac artifacts
        run: npm run dist:mac

      # What is *inside* the app, not just that an app came out. See
      # scripts/check-package.mjs for the 1.0 GB this is here to prevent.
      - name: The package carries what it should
        run: node scripts/check-package.mjs mac

      - name: Upload the mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  windows:
    # Built natively on Windows. Cross-compiling the native modules from macOS
    # is the dominant failure mode in this space, and NSIS would additionally
    # need Wine on a Mac — one more untested moving part between source and
    # installer. `better-sqlite3` downloads a prebuilt Electron binary and
    # `node-pty` ships an N-API prebuild, so no compiler is on the critical path
    # here either; the runner is about being the right platform, not toolchain.
    runs-on: windows-latest
    timeout-minutes: 45
    if: inputs.platforms != 'macos'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Gating. `continue-on-error` came off here only after the whole of
      # `npm test` — vitest *and* the Electron crypto probe — was run to green
      # on a real Windows 11 machine on the merge commit that removed it:
      # 3654 passed, 108 skipped, 0 failed, plus 18/18 crypto checks and both
      # tsc projects clean. Not inferred from the macOS run, and not inferred
      # from the port's own run either: main gained roughly four hundred tests
      # between the port being written and it being merged, and exactly one of
      # them was red on Windows.
      #
      # That last part is the standing hazard now that the gate is real — a
      # test written on a Mac can only be known to pass here when this job
      # runs it. That is the point of the job.
      #
      # What the suite does *not* claim on Windows is written at each skip
      # rather than here, so the list cannot go stale: POSIX file modes, the
      # POSIX shell the hook command is written for, and the macOS-only
      # updater and its `.app` fixtures.
      - name: Test
        run: npm test

      - name: Build the Windows artifacts
        run: npm run dist:win

      # The `win:` block carried the same latent allowlist bug the `mac:` block
      # was caught with, and survived only because CI happened to check out a
      # tree with no `ios/` in it. Checked now rather than hoped for.
      - name: The package carries what it should
        run: node scripts/check-package.mjs win

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1

  release:
    # One job creates the Release. Two jobs both calling `gh release create` is
    # a race, and the loser's assets do not land.
    needs: [macos, windows]
    # A dispatched run builds and stops. Publishing is a tag's job and only a
    # tag's job — otherwise "let me just check the installer size" and "ship it
    # to everyone" are the same button.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Collect both platforms
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: shasum -a 256 *.dmg *.zip *.exe > SHA256SUMS.txt


      # `--generate-notes` writes the commit summary; `--notes` is prepended to
      # it. The install note is not decoration: both builds are unsigned, so a
      # first launch without it looks like a broken download on either platform.
      #
      # The product name is read from package.json and substituted into a
      # placeholder rather than typed here — this repo keeps the name in one
      # place, and a workflow is no more exempt from that than a component is.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="$(node -p "require('./package.json').productName")"
          notes="$(cat <<'NOTE'
          ### Install

          macOS 12 or later, Apple silicon: open `-arm64.dmg` and drag the app
          to Applications. There is no Intel Mac build — macOS 27 runs on none.

          Windows 10 or later, x64: run `-x64-setup.exe`. There is no separate
          ARM build; Windows on ARM runs the x64 one. The whole test suite runs
          on a Windows runner and gates this installer — a red Windows test stops
          the release rather than being waved through.

          Neither build is signed. macOS will refuse the first launch: either
          right-click the app and choose *Open*, or clear the quarantine flag:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/{{APP}}.app"
          ```

          Windows SmartScreen will warn instead: choose *More info*, then
          *Run anyway*. The `-portable.exe` needs no installation and cannot
          update itself.

          {{APP}} runs agent CLIs; it does not bundle them. At least one of
          Claude Code, Codex CLI or Gemini CLI needs to be installed and
          authenticated already.

          The app checks for new versions and installs them itself, so the
          `.zip` and `latest*.yml` files are for the updater rather than for
          you. `SHA256SUMS.txt` lists the checksum of every artifact below.
          NOTE
          )"

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "${notes//\{\{APP\}\}/$app}" \
            release/*.dmg \
            release/*.zip \
            release/*.exe \
            release/*.blockmap \
            release/latest-mac.yml \
            release/latest.yml \
            release/SHA256SUMS.txt
