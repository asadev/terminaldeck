name: Release

# Only a version tag releases. Pushing to main never does — cutting a release
# is an explicit act by the owner (`npm version …` then `git push --follow-tags`).
#
# `workflow_dispatch` builds the same installers from any commit and stops short
# of publishing. It is not a convenience: the working tree on the machine this
# is developed from is routinely mid-edit across several agents at once, and a
# local `dist:win` bakes whatever half-finished state happens to be on disk into
# the artifact. A dispatched run is the only way to get an installer that
# provably corresponds to a commit — CI checks the tree out clean.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build (a dispatched run never publishes)
        type: choice
        options: [both, windows, macos]
        default: both

permissions:
  # Creating the Release and uploading its assets. Nothing else.
  contents: write

jobs:
  macos:
    # arm64 only, built natively — macos-latest is Apple silicon. No x64 slice
    # is produced: macOS 27 drops Intel hardware entirely, and an x64 build here
    # could only ever be cross-compiled and never tested on real Intel hardware.
    runs-on: macos-latest
    timeout-minutes: 45
    if: inputs.platforms != 'windows'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No cache here on purpose: a release is rare, and the one thing worse
      # than a slow release build is one assembled from a stale node_modules.
      - name: Install
        run: npm ci

      # A tag that disagrees with package.json means the artifacts inside the
      # dmg would be stamped with a different version than the release naming
      # them. `npm version` keeps the two in step; this catches a hand-made tag.
      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # This step signs. That is the whole reason it is not a one-liner.
      #
      # Until 0.1.9 this job ran `npm run dist:mac` on a hosted runner with an
      # empty keychain, deliberately and with a comment explaining why, and the
      # published dmg was therefore unsigned. Every stranger who downloaded it
      # was told the app "is damaged and can't be opened" — Gatekeeper's wording
      # for an unsigned quarantined bundle, which reads like a corrupt download
      # and loses the user right there. The certificate existed on the owner's
      # Mac and never reached the file anyone could actually download.
      #
      # The fix could have been a documented manual step. It was not, because
      # that is what already existed: SIGNING-HANDOFF.md named
      # `scripts/mac-release-signed.sh` as the thing to run before publishing,
      # and 0.1.9 shipped unsigned anyway. A release step that depends on
      # somebody remembering, on one particular laptop, is a step that gets
      # skipped — and it got skipped the first time it counted. So the signing
      # moved to the machine that builds the artifact, where it cannot be
      # forgotten.
      #
      # `scripts/mac-release-signed.sh` is the same script the owner runs
      # locally; it takes its identity and its notarization key from repository
      # secrets when they are present. It also *verifies* — codesign, spctl and
      # stapler against the app, the disk image and the app inside the update
      # zip — and exits non-zero if any of that fails. So this step is both the
      # signing and the gate: a build that is not properly signed, notarized and
      # stapled fails here rather than reaching the release page.
      #
      # The script runs `npm run build && npm run build:pwa` itself, and both
      # parts matter. electron-builder packages whatever is in `out/` and does
      # not produce it — a run without the build step fails the asar sanity
      # check ("out/main/index.js … was not found in this archive"), which is
      # verified behaviour, not a guess. `build:pwa` is the part that was
      # missing until 0.1.6, and it took three releases to notice: `pwa/dist` is
      # build output, so it is gitignored, so a clean CI checkout does not have
      # it, so the electron-builder allowlist line `pwa/dist/**/*` matched zero
      # files — and an allowlist entry that matches nothing looks exactly like
      # one whose files were all excluded. Nothing warned. Three releases
      # shipped with the phone client absent.
      #
      # The unsigned fallback is for forks. This repository is MIT and someone
      # else's checkout has none of these secrets; failing their build outright
      # would be rude and would teach them nothing. They get an unsigned build
      # and release notes that say so. What they do NOT get is this repository
      # publishing an unsigned dmg by accident: on a tag, in `asadev/terminaldeck`,
      # missing secrets are a hard error naming exactly what is missing.
      #
      # The macOS paragraph of the release notes is written here rather than in
      # the release job, because this is the only job that knows which of the
      # two happened. The release job runs on Ubuntu and could not tell a signed
      # dmg from an unsigned one if it wanted to.
      - name: Build, sign and notarize the mac artifacts
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SIGNED_ONLY: ${{ vars.TD_MAC_SIGNED_ONLY }}
        run: |
          set -euo pipefail

          if [ -n "${MACOS_CERTIFICATE_P12:-}" ] && [ "${SIGNED_ONLY:-}" = 'true' ]; then
            # Apple's notarization service can stop answering for a whole team,
            # and on 2026-08-16 it did: four submissions sat `In Progress` for
            # hours, one of them a 330-byte probe sent through a different auth
            # path, so the hold was on the account and no artifact this job
            # builds could have cleared it. Without this branch a tag push waits
            # out the script's two-hour timeout and then fails, and the release
            # simply does not happen.
            #
            # A repository *variable* rather than a code change, because the
            # condition is Apple's and it will end without warning. Flip
            # TD_MAC_SIGNED_ONLY back to false and the next tag notarizes again.
            # It is deliberately not automatic: a notarization that fails for
            # any other reason is usually the wrong certificate, and that must
            # stay a hard error rather than silently downgrading every release.
            scripts/mac-release-signed.sh --signed-only
            cat > release/mac-install-note.md <<'NOTE'
          macOS 12 or later, Apple silicon: open `-arm64.dmg` and drag the app to
          Applications. There is no Intel Mac build: macOS 27 runs on no Intel Mac.

          This build **is** signed with a Developer ID certificate, but it is not
          notarized — Apple's notarization service is not currently completing
          submissions for this developer account. macOS will therefore say the
          developer cannot be verified and offer no button on a normal
          double-click. **Right-click the app and choose *Open*, then confirm.**
          You only do this once, and the app opens normally afterwards.

          This is not the "app is damaged" message an unsigned build produces —
          the signature is real and you can check it yourself:

          ```sh
          codesign -dv --verbose=2 /Applications/Terminal\ Deck.app
          ```
          NOTE
            exit 0
          fi

          if [ -n "${MACOS_CERTIFICATE_P12:-}" ]; then
            scripts/mac-release-signed.sh
            cat > release/mac-install-note.md <<'NOTE'
          macOS 12 or later, Apple silicon: open `-arm64.dmg` and drag the app to
          Applications. It is signed with a Developer ID certificate and notarized
          by Apple, and the notarization ticket is stapled to both the app and the
          disk image — so it opens the ordinary way, with no right-click, no
          `xattr`, and no network. There is no Intel Mac build: macOS 27 runs on
          no Intel Mac.
          NOTE
            exit 0
          fi

          if [ "${GITHUB_REF_TYPE:-}" = tag ] && [ "${GITHUB_REPOSITORY:-}" = 'asadev/terminaldeck' ]; then
            echo "::error::Refusing to publish an unsigned macOS build. v0.1.9 shipped unsigned and every download said 'Terminal Deck is damaged and can't be opened'. Set the repository secrets MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER — run scripts/mac-ci-secrets.sh — then re-run this job."
            exit 1
          fi

          npm run dist:mac
          cat > release/mac-install-note.md <<'NOTE'
          macOS 12 or later, Apple silicon: open `-arm64.dmg` and drag the app to
          Applications. There is no Intel Mac build: macOS 27 runs on no Intel Mac.

          **This build is not signed**, because it was produced by a checkout with
          no Developer ID certificate. macOS will refuse the first launch and say
          the app is damaged, which is Gatekeeper's wording for "unsigned", not a
          corrupt download. Either right-click the app and choose *Open*, or clear
          the quarantine flag:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/{{APP}}.app"
          ```
          NOTE

      # What is *inside* the app, not just that an app came out. See
      # scripts/check-package.mjs for the 1.0 GB this is here to prevent.
      - name: The package carries what it should
        run: node scripts/check-package.mjs mac

      - name: Upload the mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/mac-install-note.md
          if-no-files-found: error
          retention-days: 1

  windows:
    # Built natively on Windows. Cross-compiling the native modules from macOS
    # is the dominant failure mode in this space, and NSIS would additionally
    # need Wine on a Mac — one more untested moving part between source and
    # installer. `better-sqlite3` downloads a prebuilt Electron binary and
    # `node-pty` ships an N-API prebuild, so no compiler is on the critical path
    # here either; the runner is about being the right platform, not toolchain.
    runs-on: windows-latest
    timeout-minutes: 45
    if: inputs.platforms != 'macos'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Gating. `continue-on-error` came off here only after the whole of
      # `npm test` — vitest *and* the Electron crypto probe — was run to green
      # on a real Windows 11 machine on the merge commit that removed it:
      # 3654 passed, 108 skipped, 0 failed, plus 18/18 crypto checks and both
      # tsc projects clean. Not inferred from the macOS run, and not inferred
      # from the port's own run either: main gained roughly four hundred tests
      # between the port being written and it being merged, and exactly one of
      # them was red on Windows.
      #
      # That last part is the standing hazard now that the gate is real — a
      # test written on a Mac can only be known to pass here when this job
      # runs it. That is the point of the job.
      #
      # What the suite does *not* claim on Windows is written at each skip
      # rather than here, so the list cannot go stale: POSIX file modes, the
      # POSIX shell the hook command is written for, and the macOS-only
      # updater and its `.app` fixtures.
      - name: Test
        run: npm test

      - name: Build the Windows artifacts
        run: npm run dist:win

      # The `win:` block carried the same latent allowlist bug the `mac:` block
      # was caught with, and survived only because CI happened to check out a
      # tree with no `ios/` in it. Checked now rather than hoped for.
      - name: The package carries what it should
        run: node scripts/check-package.mjs win

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1

  release:
    # One job creates the Release. Two jobs both calling `gh release create` is
    # a race, and the loser's assets do not land.
    needs: [macos, windows]
    # A dispatched run builds and stops. Publishing is a tag's job and only a
    # tag's job — otherwise "let me just check the installer size" and "ship it
    # to everyone" are the same button.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Collect both platforms
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # The server half, which was on npm and nowhere on this page.
      #
      # Somebody opening the releases page saw a Mac download and a Windows
      # download and nothing at all for a Linux server — while the thing that
      # runs on one is the same source tree, tagged the same way. It is built
      # here rather than uploaded from a developer's machine for the reason the
      # dispatched-run comment at the top of this file gives: a tarball packed
      # locally carries whatever was on that disk, and this one provably
      # corresponds to the tag.
      #
      # `npm pack` rather than `npm publish`: publishing is a separate act with
      # a separate credential, and a release asset is what a box with no route
      # to the registry needs.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build the server package
        run: |
          npm ci
          npm run dist:headless
          npm pack ./out/headless --pack-destination release

      # The installer, beside the package it installs. `terminaldeck.dev/install.sh`
      # serves this same file; having it here as well is what makes a release
      # self-contained — the script, the tarball, and a checksum for both.
      - name: The installer, beside it
        run: cp scripts/install-headless.sh release/install.sh

      - name: Checksums
        working-directory: release
        run: shasum -a 256 *.dmg *.zip *.exe *.tgz install.sh > SHA256SUMS.txt


      # `--generate-notes` writes the commit summary; `--notes` is prepended to
      # it. The install note is not decoration: an unsigned first launch looks
      # like a broken download on either platform, and saying so is the
      # difference between a user right-clicking and a user giving up.
      #
      # The macOS paragraph is NOT written here. It comes from
      # `mac-install-note.md`, which the macOS job wrote, because only that job
      # knows whether the dmg it produced was actually signed and notarized —
      # this job runs on Ubuntu and has no `codesign` to ask. Hardcoding "the
      # macOS build is signed" here would be a claim this job cannot check, and
      # the previous version of this file hardcoded the opposite claim and was
      # right for three releases and then wrong.
      #
      # `mac-install-note.md` is deliberately absent from the asset list below:
      # it is a note *about* the release, not a file anyone should download.
      #
      # The product name is read from package.json and substituted into a
      # placeholder rather than typed here — this repo keeps the name in one
      # place, and a workflow is no more exempt from that than a component is.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="$(node -p "require('./package.json').productName")"
          macnote="$(cat release/mac-install-note.md)"
          notes="$(cat <<'NOTE'
          ### Install

          {{MACNOTE}}

          Windows 10 or later, x64: run `-x64-setup.exe`. There is no separate
          ARM build; Windows on ARM runs the x64 one. The whole test suite runs
          on a Windows runner and gates this installer — a red Windows test stops
          the release rather than being waved through.

          The Windows build is not signed, so SmartScreen will warn on first run:
          choose *More info*, then *Run anyway*. The `-portable.exe` needs no
          installation and cannot update itself.

          {{APP}} runs agent CLIs; it does not bundle them. At least one of
          Claude Code, Codex CLI or Gemini CLI needs to be installed and
          authenticated already.

          The app checks for new versions and installs them itself, so the
          `.zip` and `latest*.yml` files are for the updater rather than for
          you. `SHA256SUMS.txt` lists the checksum of every artifact below.

          ### On a server

          `install.sh` and `terminaldeck-*.tgz` are the headless host: a Linux
          box with no screen, driven from the app or a phone. It dials out to
          the relay, so there is no port to open and nothing to reach it at.

              curl -fsSL https://terminaldeck.dev/install.sh | sh
              terminaldeck pair

          Or install the tarball beside it — `npm install -g ./terminaldeck-*.tgz`
          — which is what a machine with no route to the npm registry needs. It
          builds `node-pty`, so `python3`, `make` and `g++` have to be there;
          the script checks before it downloads anything and names the packages
          for your distro. Node 22 or newer is required and the script fetches
          one into its own folder when the machine has none.
          NOTE
          )"

          notes="${notes//\{\{MACNOTE\}\}/$macnote}"
          notes="${notes//\{\{APP\}\}/$app}"

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "$notes" \
            release/*.dmg \
            release/*.zip \
            release/*.exe \
            release/*.blockmap \
            release/latest-mac.yml \
            release/latest.yml \
            release/SHA256SUMS.txt \
            release/*.tgz \
            release/install.sh
