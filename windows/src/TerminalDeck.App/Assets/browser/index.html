<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<style>
:root{color-scheme:light dark;--canvas:light-dark(#fafafa,#191919);--ink:light-dark(#242424,#f0f0f0);--secondary:light-dark(#606060,#b5b5b5);--tile:light-dark(#efefef,#292929)}
*{box-sizing:border-box}body{font:14px/1.6 system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);padding:32px}main{max-width:360px;text-align:center}.symbol{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:var(--tile);margin:0 auto 20px;font-size:26px;color:var(--secondary)}h1{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 10px}p{margin:0;color:var(--secondary)}
</style>
</head>
<body><main><div class="symbol" aria-hidden="true">◎</div><h1>New tab</h1><p>Enter a web address or search above.</p></main></body>
</html>
